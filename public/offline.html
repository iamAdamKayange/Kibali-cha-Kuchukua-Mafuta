<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huna muunganisho - Kibali Mafuta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      align-items: center;
      background: linear-gradient(135deg, #0f4c81, #1a6b9f);
      color: white;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 420px;
    }

    .icon {
      font-size: 72px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .btn {
      background: white;
      border: 0;
      border-radius: 12px;
      color: #0f4c81;
      cursor: pointer;
      display: inline-block;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
    }

    .retry {
      font-size: 14px;
      margin-top: 12px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon" aria-hidden="true">&#128246;</div>
    <h1>Huna muunganisho</h1>
    <p>
      Unaonekana huna muunganisho wa mtandao.
      Tafadhali angalia intaneti yako na ujaribu tena.
    </p>
    <button class="btn" type="button" onclick="window.location.reload()">Jaribu Tena</button>
    <div class="retry">Ukurasa utajipakia mtandao utakaporudi</div>
  </main>
  <script>
    window.addEventListener('online', function () {
      window.location.reload()
    })
  </script>
</body>
</html>
